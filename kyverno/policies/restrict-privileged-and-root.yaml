apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-privileged-and-root
  annotations:
    policies.kyverno.io/title: Restrict privileged and root containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Pods must run as non-root, may not be privileged or escalate privileges,
      must use a read-only root filesystem and must drop all Linux capabilities.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Pods must set spec.securityContext.runAsNonRoot: true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: harden-containers
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: >-
          Containers must set privileged: false, allowPrivilegeEscalation: false,
          readOnlyRootFilesystem: true and drop ALL capabilities.
        pattern:
          spec:
            =(initContainers):
              - securityContext:
                  privileged: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
            containers:
              - securityContext:
                  privileged: false
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
